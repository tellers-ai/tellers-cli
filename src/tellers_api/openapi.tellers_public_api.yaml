        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - accepts-api-key
      summary: Delete Current User
      description: "Preview \u2014 or, with ``dry_run=false``, carry out \u2014 deleting\
        \ your own account (SSE).\n\n**This previews by default.** ``dry_run`` is\
        \ true unless you say otherwise,\nso a call that forgets the parameter reports\
        \ what deleting the account\n*would* take and touches nothing. The ``done``\
        \ event carries ``preview``\nwith the counts \u2014 assets, chats, assistants,\
        \ groups, the Stripe\nsubscriptions that would be cancelled, whether the Firebase\
        \ login would go\ntoo \u2014 for showing the user what they are about to lose.\n\
        \nA caller that means it passes ``dry_run=false``. That runs the same purge\n\
        as ``POST /admin/delete_account`` and streams the same events: the Stripe\n\
        subscriptions, every asset the user created with its renditions and\nkeyframes,\
        \ their chats, the assistants they authored and the media those\ncarry, the\
        \ groups they solely own, the SQL row, the S3 objects and \u2014 in\nproduction\
        \ only \u2014 the Firebase account.\n\n**A client that means to delete must\
        \ check what it got.** Both modes answer\n200 and end in a ``done`` event;\
        \ only ``dry_run`` and the counters\ndistinguish them. Reporting \"your account\
        \ is deleted\" off the status code\nalone would be wrong for the default call,\
        \ which deleted nothing.\n\nIt streams rather than answering once because\
        \ a large account takes longer\nto delete than a load balancer will hold an\
        \ idle connection open; the\nprogress events are what keep it open. A caller\
        \ that disconnects does not\nstop the purge, and calling again finishes whatever\
        \ was left.\n\nThe email keeps its signup-history row, so registering again\
        \ with the same\naddress earns no second signup grant."
      operationId: delete_current_user_users_me_delete
      parameters:
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          description: 'Defaults to **true**: the call previews and deletes nothing.
            Pass `dry_run=false` to actually delete the account. Check the `done`
            event''s `dry_run` field to see which of the two you got.'
          default: true
          title: Dry Run
        description: 'Defaults to **true**: the call previews and deletes nothing.
          Pass `dry_run=false` to actually delete the account. Check the `done` event''s
          `dry_run` field to see which of the two you got.'
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: "Server-sent events. `progress` events report each stage as\
            \ it happens; the final `done` event is the object below \u2014 a summary\
            \ of what was deleted, or, on a dry run, a `preview` of what would be."
          content:
            text/event-stream:
              schema:
                type: string
                $ref: '#/components/schemas/DeleteAccountSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
