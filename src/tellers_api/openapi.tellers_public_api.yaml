  /video/description/{source_file_id}:
    post:
      tags:
      - accepts-api-key
      summary: Request Description
      description: "Run the description (Gemini analysis) task on an asset, or on\
        \ a folder.\n\nRequires WRITE access on the asset or admin.\n\nFor a single\
        \ asset, ``needs_downscale`` reports whether a player/Gemini-\ncompatible\
        \ video rendition is missing. When it is, we encode a compatible\nproxy first\
        \ and chain the description task after it (the downscale's\n``link`` callback),\
        \ so Gemini only runs once a usable rendition exists. The\nreturned ``task_id``\
        \ always tracks the description task, so callers poll the\nsame id in both\
        \ cases.\n\nPointed at a folder, it queues a walk of that folder instead and\
        \ returns as\nsoon as the walk is queued: ``task_id`` then tracks the fan-out,\
        \ which\ndispatches one description task per asset \u2014 each exactly as\
        \ it would be\ndispatched on its own, proxy encode included \u2014 and ``needs_downscale``\
        \ is\nfalse, since which assets need one is only known once the walk runs.\
        \ The\nfolder is walked recursively; assets the caller cannot write, and assets\n\
        whose media is not uploaded, are skipped. There is no limit on its size, and\n\
        every dispatched asset is billed \u2014 the preflight route reports how many\
        \ that\nwill be before you commit to it.\n\nAn optional body forces the configuration\
        \ to analyse under, so a one-off run\ndoes not need a tellers-config committed\
        \ to the folder tree first. It\nreplaces what the tree resolves rather than\
        \ merging over it. Every entity id\nin it is checked against the caller before\
        \ anything is dispatched, and the\nwhole request is refused if one is not\
        \ theirs. The same body on the preflight\nroute shows the resulting config\
        \ first."
      operationId: request_description_video_description__source_file_id__post
      parameters:
      - name: source_file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source File Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/AnalysisConfigOverrideRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateDescriptionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /video/transcript/{source_file_id}:
    post:
      tags:
      - accepts-api-key
      summary: Request Transcript
      description: "Generate a transcript for an asset, or for every asset in a folder.\n\
        \nRequires WRITE access on the asset or admin. The task no-ops when a\ntranscript\
        \ was already generated.\n\nFor a single asset, rejects types that cannot\
        \ be transcribed with a 400.\nPointed at a folder, it queues a walk of that\
        \ folder instead and returns as\nsoon as the walk is queued: ``task_id`` then\
        \ tracks the fan-out, which\ndispatches one transcript task per asset. Types\
        \ that cannot be transcribed\nare skipped there rather than rejected \u2014\
        \ a mixed folder is the normal case \u2014\nas are assets the caller cannot\
        \ write and assets whose media is not\nuploaded. The preflight route reports\
        \ how many assets a folder would\ndispatch before you commit to it.\n\nUnlike\
        \ the description route this takes no config override: speech-to-text\nreads\
        \ none of the tellers-config. One sent here is refused with a 400 rather\n\
        than accepted and ignored, so a caller cannot believe a config applied to\
        \ a\ntranscript when nothing read it."
      operationId: request_transcript_video_transcript__source_file_id__post
      parameters:
      - name: source_file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source File Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/AnalysisConfigOverrideRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateTranscriptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /video/analysis-preflight/{source_file_id}:
    post:
      tags:
      - accepts-api-key
      summary: Analysis Preflight
      description: "Report what analysing this asset would do, without dispatching\
        \ anything.\n\nThe dry run for the two routes above, and it takes what they\
        \ take: a file or\na folder. ``description_asset_count`` and ``transcript_asset_count``\
        \ are how\nmany assets each would dispatch \u2014 0 or 1 for a file, the whole\
        \ subtree for a\nfolder \u2014 counted through the very same path, permission,\
        \ type and\nupload-status filters the walk uses, so the number is what will\
        \ actually\nrun rather than an estimate.\n\n``config`` is the tellers-config\
        \ the dispatched tasks will read, resolved at\nthis asset's own path. It is\
        \ a complete ``TellersConfigFile`` \u2014 the same\nobject ``GET /asset/tellers-config/{asset_id}``\
        \ returns \u2014 with the merged\nanalysis settings and entity ids in it rather\
        \ than beside it, so reading\n``config.analysis`` gives what will actually\
        \ apply. ``config_assets`` lists\nthe config files that contributed, nearest\
        \ last.\n\nFor a folder the counts cover the whole subtree while ``config``\
        \ is what a\nfile sitting directly in it resolves. ``overriding_config_assets``\
        \ lists the\ntellers-configs nested deeper that make those two disagree: assets\
        \ under one\nof those resolve it instead, so while this is non-empty the reported\
        \ config\ndoes not describe everything counted. It is capped, and\n``overriding_config_assets_truncated``\
        \ says when there were more.\n\nAn optional body forces a configuration, and\
        \ ``config`` then reports what\nthat leaves in force \u2014 through ``apply_config_override``,\
        \ the same function\nthe analysis itself applies it with, so what this shows\
        \ is what would run.\nSince an override replaces the folder tree outright,\
        \ this is also how to see\nwhat a given body drops: ``config_assets`` comes\
        \ back empty, and any entity\nthe tree contributed is gone unless the body\
        \ names it again. Its entity ids\nare validated exactly as the run routes\
        \ validate them, which makes this the\nway to find out whether an override\
        \ will be accepted without spending\nanything on it.\n\nIt is a POST because\
        \ of that body, not because it changes anything: it\ndispatches nothing and\
        \ bills nothing.\n\nRequires WRITE access, like the routes it previews: a\
        \ folder's counts only\ninclude assets the caller can write, so the same call\
        \ by two people can\nlegitimately return different numbers."
      operationId: analysis_preflight_video_analysis_preflight__source_file_id__post
      parameters:
      - name: source_file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source File Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/AnalysisConfigOverrideRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisPreflightResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
