  /asset/most_recent:
    get:
      tags:
      - accepts-api-key
      summary: Get Most Recent Files
      description: 'Return the most recently added file(s) the user has read access
        to.

        Uses default group(s) unless group_id is set (user must have read access to
        that group).

        before: only files with last_edit < before (older); use the smallest last_edit
        from a previous page to get the next page.'
      operationId: get_most_recent_files_asset_most_recent_get
      parameters:
      - name: path
        in: query
        required: false
        schema:
          type: string
          default: /
          title: Path
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Limit
      - name: group_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Id
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
