      additionalProperties: false
      type: object
      required:
      - video
      - image
      - audio
      - tts
      - search_stock
      - search_me
      - search_voices
      title: ToolsCapabilities
      description: "Every ``/tools/*`` capability, keyed by area.\n\nGrouped rather\
        \ than returned as one flat list so a client can jump straight\nto the area\
        \ it cares about \u2014 ``image`` to pick a model, ``search_me`` to see\n\
        which search modes exist \u2014 instead of filtering."
