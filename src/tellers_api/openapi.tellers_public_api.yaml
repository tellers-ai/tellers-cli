          - type: 'null'
          title: Resolution
          description: 'Output resolution. Supported values vary by model: p-video/veo
            support 720p/1080p; wan/seedance support 480p/720p; minimax-h3-max supports
            480p/768p; kling/sora/runway ignore this field.'
        input_frame:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/AssetFrameRef'
          - type: 'null'
          title: Input Frame
          description: Start (first) frame. An asset id for the default frame, or
            an object pinning `timestamp_seconds` / `is_last_frame`.
        output_frame:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/AssetFrameRef'
          - type: 'null'
          title: Output Frame
          description: "End (last) frame. An asset id for the default frame, or an\
            \ object pinning `timestamp_seconds` / `is_last_frame`. Not every model\
            \ accepts an end frame \u2014 see GET /tools/models."
        input_audio:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/AssetPeriodRef'
          - type: 'null'
          title: Input Audio
          description: "Audio reference. An asset id for the whole asset, or an object\
