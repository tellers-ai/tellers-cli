    get:
      tags:
      - accepts-api-key
      summary: Stream Chat Messages
      description: "Subscribe to a chat's agent SSE stream (Redis-backed).\n\nEmits\
        \ the exact same events as ``POST /agent/response`` \u2014 both sides read\n\
        from the per-chat Redis Stream written by the producer running the agent.\n\
        \nQuery params:\n  - ``last_event_id``: resume from this Redis stream entry\
        \ id. Pass the\n    ``id:`` of the last SSE event you received to avoid duplicates.\
        \ When\n    omitted, the subscription starts from \"now\" \u2014 only events\
        \ produced\n    after the GET request arrives are delivered, no history is\
        \ replayed.\n  - ``after``: accepted for backward compatibility and currently\
        \ ignored.\n    Use ``last_event_id`` instead.\n\nLike ``POST /agent/response``,\
        \ the stream is terminated by a\n``tellers.stream.end`` event carrying the\
        \ reason the turn ended. It is also\nemitted when the subscription finds the\
        \ chat already finished, so a client\nthat reconnects late still gets a definitive\
        \ answer instead of an idle\nsocket."
      operationId: stream_chat_messages_agent_response__chat_id__get
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Chat Id
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: After
      - name: last_event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Event Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /agent/response:
    post:
      tags:
      - accepts-api-key
      summary: Process Agent Message
      description: "Run the agent and stream its events as SSE.\n\nThe last event\
        \ of the stream is always ``tellers.stream.end``, whose\n``reason`` tells\
        \ the client why the turn ended (``completed``,\n``cancelled``, ``insufficient_tokens``,\
        \ ``budget_exceeded``, ``error``,\n``interrupted``). ``insufficient_tokens``\
        \ means the account is out and\nneeds a top-up; ``budget_exceeded`` means\
        \ the run spent the credit\nallocated to it, which buying tokens does not\
        \ fix. A stream that closes\n*without* it was cut short by the network \u2014\
        \ reconnect with\n``GET /agent/response/{chat_id}`` to pick the run back up."
      operationId: process_agent_message_agent_response_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
