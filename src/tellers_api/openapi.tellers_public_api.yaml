          - type: 'null'
          title: Prefer Compaction
          description: The preferred compaction threshold the message was sent with,
            as `prefer_compaction` in the agent message request. Null when it was
            sent without one -- the model's own threshold applied -- and on messages
            written before the settings were recorded at all.
        llm_settings:
          anyOf:
          - additionalProperties: true
