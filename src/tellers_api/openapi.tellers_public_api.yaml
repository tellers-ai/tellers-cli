          - type: 'null'
          title: Llm Settings
          description: The LLM settings the message was sent with that have no field
            of their own above -- `tool_exposure`, `compaction` and the like -- keyed
            by their name in the agent message request. Restoring the composer means
            the fields above plus this. It holds no value that is already a field,
