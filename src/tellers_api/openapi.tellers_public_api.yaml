        required: true
        schema:
          type: string
          title: Path
      - name: limit
        in: query
        required: true
        schema:
          type: integer
          title: Limit
      - name: page
        in: query
        required: true
        schema:
          type: integer
          title: Page
      - name: folder_on_top
        in: query
        required: false
