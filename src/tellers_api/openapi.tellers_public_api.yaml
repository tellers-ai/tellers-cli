    ToolErrorBody:
      properties:
        detail:
          type: string
          title: Detail
          description: Why the call was refused, in the tool's own words.
      type: object
      required:
      - detail
      title: ToolErrorBody
      description: "What a refused tool call returns: FastAPI's ``detail`` envelope.\n\
        \nThe message is the tool's own \u2014 ``_run_tool`` passes ``ToolError.message``\n\
        straight through \u2014 so it already says which account limit was reached."
    ToolExposure:
      type: string
      enum:
      - search
      - flat_search
      - flat
      title: ToolExposure
      description: "How much of a tool the model is shown up front.\n\nWhat deferral\
        \ hides depends on whether the tool is in a namespace, and the\ndifference\
        \ is the whole point of this enum. Per OpenAI's tool search guide:\na deferred\
        \ tool *inside a namespace* is hidden completely \u2014 the model sees\nonly\
        \ the namespace name and description \u2014 while a deferred *top-level*\n\
        function still shows its name and description, so deferral there only holds\n\
        back the parameter schema. Measured over the current 56 tools:\n\n==============\
        \  ============================  ==========\nexposure        visible up front\
        \              tokens\n==============  ============================  ==========\n\
        ``search``      11 namespace descriptions          ~0.5k\n``flat_search``\
        \ 56 tool names + descriptions      ~10.2k\n``flat``        the above plus\
        \ every schema       ~44.6k\n==============  ============================\
        \  ==========\n\n``search`` uses namespace descriptions and hides the names\
        \ inside them;\n``flat_search`` exposes top-level tool names and descriptions\
        \ while\ndeferring only parameter schemas. ``flat`` removes deferral entirely.\n\
        \nGrouping without deferring is deliberately not offered: namespaces exist\n\
        to make search legible, so once every schema is up front they buy nothing\n\
        and cost their own descriptions.\n\nThe member value is what the API accepts\
        \ on the wire."
    ToolsCapabilities:
      properties:
        video:
          $ref: '#/components/schemas/VideoCapability'
        image:
          $ref: '#/components/schemas/ImageCapability'
        audio:
