          - gpt-5.4-nano
          - gpt-5.3-codex
          - gpt-5.2-2025-12-11
          - gpt-5-mini-2025-08-07
          title: Llm Model
          description: The model to use to generate the response.
          default: gpt-5.5-2026-04-23
        tools:
