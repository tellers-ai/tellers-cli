    VideoModelCapability:
      properties:
        id:
          type: string
          title: Id
          description: Value to pass as `model`.
        tool_id:
          type: string
          title: Tool Id
          description: "The agent tool backing this model. Join to `available_agent_tools`\
            \ in GET /settings for its display name, description and pricing \u2014\
            \ kept there rather than duplicated here so there is one source of truth.\
            \ Several models can share a tool."
        required:
          items:
            type: string
          type: array
          title: Required
          description: Request fields this model cannot do without. Everything else
            in the request schema is optional.
        formats:
          items:
            type: string
          type: array
          title: Formats
          description: Aspect ratios acted on.
        resolutions:
          items:
            type: string
          type: array
          title: Resolutions
          description: Resolutions acted on. Empty = field ignored.
        supports_input_frame:
          type: boolean
          title: Supports Input Frame
          description: Whether `input_frame` (start frame) is used.
        supports_output_frame:
          type: boolean
          title: Supports Output Frame
          description: Whether `output_frame` (end frame) is used. Pair it with `input_frame`;
            some models reject an end frame on its own.
        supports_input_audio:
          type: boolean
          title: Supports Input Audio
          description: Whether `input_audio` (audio reference) is used.
        supports_frame_timestamp:
          type: boolean
          title: Supports Frame Timestamp
          description: Whether a frame reference may pin a `timestamp_seconds` / `is_last_frame`.
            False means only a bare asset id is accepted.
        format_requires_resolution:
          type: boolean
          title: Format Requires Resolution
          description: This model only acts on `format` when `resolution` is also
            given; sent alone it would be ignored, so it is rejected.
          default: false
        format_ignored_with_input_frame:
          type: boolean
          title: Format Ignored With Input Frame
          description: This model takes its aspect ratio from `input_frame` whenever
            one is given; `format` sent alongside would be ignored, so the pair is
            rejected. Crop the frame to the shape you want instead.
          default: false
        supports_audio_range:
          type: boolean
          title: Supports Audio Range
          description: Whether `input_audio` may pin a time range. False means only
            a bare asset id is accepted.
        max_char:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Char
          description: Longest `prompt` accepted, in characters. None = unbounded.
      additionalProperties: false
      type: object
      required:
      - id
      - tool_id
      - required
      - formats
      - resolutions
      - supports_input_frame
      - supports_output_frame
      - supports_input_audio
      - supports_frame_timestamp
      - supports_audio_range
      title: VideoModelCapability
      description: "What one video model accepts, as published by ``GET /tools/models``.\n\
        \n``formats`` / ``resolutions`` list the values the model actually *acts on*.\n\
        An empty list means the field is ignored and the model's native output is\n\
        used \u2014 not that any value is accepted."
