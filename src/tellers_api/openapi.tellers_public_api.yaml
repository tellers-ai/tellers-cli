  /project/{project_id}/export/preflight:
    get:
      tags:
      - accepts-api-key
      summary: Export Preflight
      description: "Check a project's source renditions before starting an export.\n\
        \nAlways reports all four resolutions \u2014 480p, 720p, 1080p and 4k \u2014\
        \ so the id\nis the only thing to pass. Each says whether every asset already\
        \ has the\nrendition the render would read (``has_all_renditions``), which\
        \ assets still\nneed one generated (``state`` ``needs_rendition`` or ``generating``,\
        \ with the\n``suggested_min_dimension`` to downscale to), and whether the\
        \ render would\npull a 2K-or-larger input (``uses_2k_input``) \u2014 the thing\
        \ that makes an\nexport slow even when nothing is missing.\n\nNothing is queued:\
        \ an asset reported as ``needs_rendition`` stays that way\nuntil a downscale\
        \ is asked for. An export started regardless still renders \u2014\n``source_limited``\
        \ assets are upscaled, and ``missing`` ones are left out of\nthe playlist\
        \ entirely, so their clips come out empty."
      operationId: export_preflight_project__project_id__export_preflight_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPreflightResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /project/{project_id}/export/generate_missing_renditions:
    post:
      tags:
      - accepts-api-key
      summary: Generate Missing Renditions
      description: "Encode an export-compatible master for every clip that lacks one.\n\
        \nCovers the clips ``GET /project/{project_id}/export/preflight`` counts in\n\
        ``renditions_needed_for_optimum_export`` \u2014 those with no export-compatible\n\
        rendition at their own resolution \u2014 dispatching one downscale each, at\
        \ that\nresolution. It is the highest rendition the sources allow, so afterwards\n\
        every export reads the best master there is rather than a small proxy.\n\n\
        Assets with a downscale already running are left alone instead of being\n\
        re-encoded, and an asset the caller cannot write to is skipped so its owner\n\
        is not billed for an encode they did not ask for. Each encode is billed to\n\
        the asset's owner as it runs, the same as ``POST /video/downscale/{id}``;\n\
        the amount reported here is the preflight's estimate of it.\n\nAn asset holds\
        \ one proxy rendition at a time, so a new master replaces the\nsmaller proxy\
        \ that asset had."
      operationId: generate_missing_renditions_project__project_id__export_generate_missing_renditions_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateMissingRenditionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /project/{project_id}/export:
    post:
      tags:
      - accepts-api-key
      summary: Export Project
      description: 'Start async export of project to MP4 at one or more resolutions.
        Creates the export asset

        in the API, then enqueues a task that browser-encodes the highest requested
        resolution.

        Smaller renditions are enqueued as downscaling_task jobs (not chained). The
        export

        appears as a new video asset in the project''s export folder (project name
        + date + .mp4).


        Returns task_id and asset_id. Poll GET /users/tasks/{task_id} for completion;
        result includes asset_id.'
