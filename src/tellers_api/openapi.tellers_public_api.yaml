components:
  schemas:
    AgentMessageRequest:
      properties:
        message:
          type: string
          title: Message
          description: The message to send to the agent
        chat_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Chat Id
          description: Optional chat ID for conversation tracking
        previous_response_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Response Id
          description: The ID of the previous response to the model. Use this to create
            multi-turn conversations.
        llm_verbosity:
          type: string
          enum:
          - low
          - medium
          - high
          title: Llm Verbosity
          description: Range of number of tokens that can be generated by the LLM,
            higher values yield more verbose responses. A value the chosen model does
            not advertise in `available_llm_models` is ignored.
          default: low
        llm_reasoning_effort:
          anyOf:
          - type: string
            enum:
            - none
            - minimal
            - low
            - medium
            - high
            - xhigh
            - max
          - type: 'null'
          title: Llm Reasoning Effort
          description: 'Controls reasoning effort: higher values yield more precise
            but slower responses. A value the chosen model does not advertise in `available_llm_models`
            is ignored.'
          default: high
        priority:
          anyOf:
          - type: string
            enum:
            - low
            - default
            - high
          - type: 'null'
          title: Priority
          description: 'Priority level for the response: ''low'' (cheaper/slower),
            ''default'' (standard), or ''high'' (premium/low-latency). Only levels
            in the chosen model''s `available_priorities` (see GET /) take effect;
            others fall back to ''default''.'
          default: default
        context:
          anyOf:
          - $ref: '#/components/schemas/AppContext'
          - type: 'null'
          description: The app context when the response is sent.
        llm_model:
          type: string
          enum:
          - gpt-6-astra
          - gpt-6.1-sol
          - gpt-6-sol
          - gpt-6-luna
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna
          - gpt-5.5-2026-04-23
          - gpt-5.5-pro-2026-04-23
          - gpt-5.4-pro-2026-03-05
          - gpt-5.4
          - gpt-5.4-mini
          - gpt-5.3-codex
          - gpt-5.2-2025-12-11
          - gpt-5-mini-2025-08-07
          - gpt-5-nano
          title: Llm Model
          description: The model to use to generate the response.
          default: gpt-6-luna
        tools:
          items:
            type: string
          type: array
          title: Tools
          description: The tools to use to generate the response. Defaults to the
            same as GET /settings (AVAILABLE_AGENT_TOOLS if set, else all tools).
        custom_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Agent Id
          description: The ID of the custom agent to use to generate the response.
            If not provided, the default custom agent will be used.
        parallel_tool_calls:
          type: boolean
          title: Parallel Tool Calls
          description: Whether to allow parallel tool calls. Defaults to true. If
            True, the tool calls will be executed in parallel. If False, the tool
            calls will be executed sequentially.
          default: true
        compaction:
          type: boolean
          title: Compaction
          description: Whether to enable automatic context cleanup when the selected
            model supports it. This keeps long conversations manageable.
          default: true
        prefer_compaction:
          anyOf:
          - type: integer
            minimum: 20000.0
          - type: 'null'
          title: Prefer Compaction
          description: 'Preferred input-token size to compact the conversation at,
            when `compaction` is enabled and the model supports it. A preference,
            not a guarantee: it is capped at the chosen model''s own threshold (`compaction_threshold`
            in `available_llm_models`), which is also what is used when this is unset,
            because past that point compaction is what keeps the request inside the
            context window. Lower it to have long conversations compacted earlier.'
        override_llm_verbosity:
          anyOf:
          - type: string
            enum:
            - low
            - medium
            - high
          - type: 'null'
          title: Override Llm Verbosity
          description: Override the verbosity of the LLM, range of number of tokens
            that can be generated by the LLM, higher values yield more verbose responses.
        override_llm_reasoning_effort:
          anyOf:
          - type: string
            enum:
            - none
            - minimal
            - low
            - medium
            - high
            - xhigh
            - max
          - type: 'null'
          title: Override Llm Reasoning Effort
          description: 'Override the reasoning effort of the LLM, controls reasoning
            effort: higher values yield more precise but slower responses.'
        tool_exposure:
          $ref: '#/components/schemas/ToolExposure'
          description: "How much of each tool the model is shown up front. 'flat_search'\
            \ (default) defers the parameter schemas behind the model's tool_search\
            \ tool but keeps every tool name and description visible, because a deferred\
            \ top-level function still shows both \u2014 roughly 10k tokens up front.\
            \ 'search' groups deferred tools into namespaces, showing only namespace\
            \ descriptions up front. 'flat' defers nothing \u2014 every schema up\
            \ front as a plain function list, no tool_search, roughly 45k tokens \u2014\
            \ and is how you rule out tool discovery entirely when the agent does\
            \ not call a tool you expect it to. Both deferring values fall back to\
            \ 'flat' on models without tool_search."
          default: flat_search
        max_tellers_token:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Max Tellers Token
          description: Maximum cumulative Tellers Token budget for the agent run.
        no_interaction:
          type: boolean
          title: No Interaction
          description: Whether to disable interaction with the agent. If True, the
            agent will try to generate a response without interacting with the user.
          default: false
      additionalProperties: false
      type: object
      required:
      - message
      title: AgentMessageRequest
