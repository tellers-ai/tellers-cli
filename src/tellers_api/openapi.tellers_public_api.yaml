      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateAssetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /project/{project_id}/export:
    post:
      tags:
      - accepts-api-key
      summary: Export Project
      description: 'Start async export of project to MP4 at one or more resolutions.
        Creates the export asset

        in the API, then enqueues a task that generates each rendition. The export
        appears as a

        new video asset in the project''s export folder (project name + date + .mp4),
        with multiple

        renditions (e.g. 480p, 720p, 1080p, 4k) attached to that asset.


        Returns task_id and asset_id. Poll GET /task/{task_id} for completion; result
        includes asset_id.'
      operationId: export_project_project__project_id__export_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                enum:
                - 480p
                - 720p
                - 1080p
                - 4k
                type: string
              description: List of resolutions to export (e.g. ["720p", "1080p"])
              title: Renditions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /billing/catalog:
    get:
      tags:
      - accepts-api-key
      summary: Get Billing Catalog
      operationId: get_billing_catalog_billing_catalog_get
      parameters:
      - name: If-None-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
