openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /users/sources/list_files:
    get:
      tags:
      - accepts-api-key
      summary: Request Files Processing
      operationId: request_files_processing_users_sources_list_files_get
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
          title: Path
      - name: limit
        in: query
        required: true
        schema:
          type: integer
          exclusiveMinimum: 0
          title: Limit
      - name: page
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          title: Page
      - name: folder_on_top
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Folder On Top
      - name: group_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Name
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileReference'
                title: Response Request Files Processing Users Sources List Files
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/get:
    get:
      tags:
      - accepts-api-key
      summary: Get User
      operationId: get_user_users_get_get
      deprecated: true
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
