    AnalysisConfigOverrideRequest:
      properties:
        config:
          $ref: '#/components/schemas/TellersConfigFile'
          description: "The configuration to analyse under, as a config file's own\
            \ contents \u2014 not the id of a stored one. It forces itself: it replaces\
            \ whatever the folder tree resolves rather than merging over it, so nothing\
            \ inherited survives, including entities the tree contributed. A field\
            \ left unset falls back to your preferences and then the app defaults,\
