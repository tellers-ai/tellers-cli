      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /asset/most_recent:
    get:
      tags:
      - accepts-api-key
      summary: Get Most Recent Files
      description: 'Return the most recently added file(s) the user has read access
        to.

        Uses default group(s) unless group_id is set (user must have read access to
        that group).

        after: only files with last_edit > after (newer).

        before: only files with last_edit < before (older); use the smallest last_edit
        from a previous page to get the next page.

        filetype: only files with the given file type(s).'
      operationId: get_most_recent_files_asset_most_recent_get
      parameters:
      - name: path
        in: query
        required: false
        schema:
          type: string
          default: /
          title: Path
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          default: 1
          title: Limit
      - name: group_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Id
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: After
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: array
                items:
                  $ref: '#/components/schemas/FileType'
              - type: 'null'
              title: Filetype
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileReference'
                title: Response Get Most Recent Files Asset Most Recent Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /asset/folder:
    post:
      tags:
      - accepts-api-key
      summary: Create Folder
      description: 'Create a folder. Either at a path (body.path) or under a parent
        folder (body.parent_asset_id + body.name).

        Path-based: ensures folder and ancestors exist for the user''s default group.

        Parent-based: parent must be a folder the user has WRITE access to.

        Callable with API key (X-Api-Key header) or Bearer token.'
      operationId: create_folder_asset_folder_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFolderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /asset/download_urls:
    post:
      tags:
      - accepts-api-key
      summary: Get Asset Download Url Batch Json
      description: Return download URL payloads for multiple assets using one shared
        config.
      operationId: get_asset_download_url_batch_json_asset_download_urls_post
