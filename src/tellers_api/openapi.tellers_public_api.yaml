          - semantic_by_scene_description
          - semantic_by_scene_sequence
          - semantic_by_asset_description
          - text_by_filename
          - text_by_file_description
          title: Search Mode
          description: Search mode. Semantic modes are embedding-based, not keyword
            matching. semantic_by_scene_keyframe matches on keyframe embeddings, semantic_by_scene_description
            on single-scene description embeddings, and semantic_by_scene_sequence
            on aggregate consecutive-scene embeddings. text_by_filename searches filenames
            by case-insensitive substring, and text_by_file_description searches asset
            descriptions by case-insensitive substring.
          default: semantic_by_scene_keyframe
        folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder
          description: Folder path to restrict the search to (e.g. '/my-project').
        file_type:
          anyOf:
          - $ref: '#/components/schemas/FileType'
          - type: 'null'
          description: Restrict results to a specific asset file type.
        format:
          anyOf:
          - type: string
            enum:
            - '16:9'
            - '9:16'
          - type: 'null'
          title: Format
          description: Filter by aspect ratio.
        only_my_files:
          type: boolean
          title: Only My Files
          description: Search only your own library, leaving out files in groups shared
            with you and public ones.
          default: false
        limit:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Limit
          description: Number of results.
          default: 10
        cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
          description: Opaque cursor returned by a previous page.
      additionalProperties: false
      type: object
      required:
