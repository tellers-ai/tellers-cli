name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Generate API client
        run: |
          curl -fsSL https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.6.0/openapi-generator-cli-7.6.0.jar -o openapi-generator-cli.jar
          OPENAPI_GENERATOR_CLI_JAR=$PWD/openapi-generator-cli.jar scripts/generate_api.sh
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
