name: Release

# Click "Run workflow" in the Actions tab (on main) to cut a release:
#   tests → bump Cargo.toml + CHANGELOG.md → tag → build → GitHub release → Homebrew.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: tellers

jobs:
  # ── 1. Test, bump the version, write the changelog, tag ─────────────────────
  prepare:
    name: Test & prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the main branch (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all tags and commits for the version and changelog

      - name: Generate API client
        uses: openapi-generators/openapitools-generator-action@v1
        with:
          generator: rust
          openapi-file: src/tellers_api/openapi.tellers_public_api.yaml
          generator-tag: v7.17.0
          command-args: >
            -o generated/tellers_api_client
            --additional-properties=packageName=tellers_api_client,packageVersion=0.1.0,library=reqwest,supportAsync=true,reqwestClient=true
            --skip-validate-spec --strict-spec=false

      - name: Patch generated API client
        run: scripts/patch_generated_api.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-v0.0.0}"
          MAJOR="${MAJOR#v}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "${LATEST:-none} → ${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version in Cargo.toml / Cargo.lock
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # First `version =` in Cargo.toml is the [package] one.
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION#v}\"/" Cargo.toml
          # The version line right after `name = "tellers"` in Cargo.lock.
          sed -i "/^name = \"tellers\"$/{n;s/^version = \".*\"/version = \"${VERSION#v}\"/}" Cargo.lock
          cargo build --locked   # fails if the lockfile edit was wrong
          git diff

      - name: Write changelog
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          scripts/release_notes.sh "$VERSION" > release-notes.md
          cat release-notes.md
          {
            echo "# Changelog"
            echo
            cat release-notes.md
            # Keep previous entries, minus the old title.
            if [ -f CHANGELOG.md ]; then tail -n +2 CHANGELOG.md | sed '1{/^$/d}'; fi
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin HEAD:main "$VERSION"

      - name: Upload release notes and generated API client
        uses: actions/upload-artifact@v4
        with:
          name: prepare
          path: |
            release-notes.md
            generated/tellers_api_client

  # ── 2. Build release binaries for every target ──────────────────────────────
  build:
    name: Build — ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm   # native ARM64 runner — no cross-compilation needed
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Download generated API client
        uses: actions/download-artifact@v4
        with:
          name: prepare
          path: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          ARCHIVE="${{ env.BINARY_NAME }}-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          sha256sum "$ARCHIVE" | cut -d' ' -f1 > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $bin     = "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe"
          $archive = "${{ env.BINARY_NAME }}-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -FilePath "$archive.sha256" -NoNewline -Encoding ascii
          echo "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-*   # archives + .sha256 files

  # ── 3. Create the GitHub Release ────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: prepare
          path: .

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: artifacts/**

  # ── 4. Push updated formula to the Homebrew tap ─────────────────────────────
  #
  # Prerequisites (one-time setup):
  #   1. Create repo  tellers-ai/homebrew-tellers  (`brew tap tellers-ai/tellers`)
  #   2. Add Formula/tellers.rb  (use .github/homebrew/tellers.rb as the seed)
  #   3. Create a GitHub PAT (classic) with the "repo" scope
  #   4. Add it as secret  HOMEBREW_TAP_TOKEN  in this repo's settings
  #
  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Generate formula
        run: |
          MACOS_ARM_SHA=$(cat "artifacts/tellers-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")
          MACOS_X86_SHA=$(cat "artifacts/tellers-${VERSION}-x86_64-apple-darwin.tar.gz.sha256")
          LINUX_X86_SHA=$(cat "artifacts/tellers-${VERSION}-x86_64-unknown-linux-musl.tar.gz.sha256")
          LINUX_ARM_SHA=$(cat "artifacts/tellers-${VERSION}-aarch64-unknown-linux-gnu.tar.gz.sha256")
          VER="${VERSION#v}"
          BASE="https://github.com/tellers-ai/tellers-cli/releases/download/${VERSION}"

          cat > tellers.rb << EOF
          class Tellers < Formula
            desc "Tellers CLI - interact with tellers.ai from the terminal"
            homepage "https://tellers.ai"
            version "${VER}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/tellers-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${MACOS_ARM_SHA}"
              else
                url "${BASE}/tellers-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${MACOS_X86_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE}/tellers-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              else
                url "${BASE}/tellers-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              bin.install "tellers"
            end

            test do
              system "#{bin}/tellers", "--help"
            end
          end
          EOF

      - name: Push formula to tap repo
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/tellers-ai/homebrew-tellers.git" tap
          mkdir -p tap/Formula
          cp tellers.rb tap/Formula/tellers.rb
          cd tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/tellers.rb
          git diff --cached --quiet || git commit -m "tellers ${VERSION}"
          git push
