[package]
name = "tellers"
version = "0.1.0"
edition = "2021"
description = "Tellers CLI - interact with tellers.ai from the terminal"
license = ""
repository = "https://github.com/tellers-oss/tellers-cli"

[dependencies]
tellers_api_client = { path = "generated/tellers_api_client", default-features = false, features = [
    "rustls-tls",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
walkdir = "2"
mime_guess = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
url = "2"
ffmpeg-sidecar = "2.2"
dirs = "5.0"
base64 = "0.22"
console = "0.15"
log = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
